name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  server:
    name: Windows server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Build HomeStreamer.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${VERSION}" -o ../dist/HomeStreamer.exe .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeStreamer-windows
          path: dist/HomeStreamer.exe

  android:
    name: Android TV app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/HomeStreamer-Android.apk
          echo "APK signing certificate:" && keytool -printcert -jarfile ../dist/HomeStreamer-Android.apk | grep -E "Owner|SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomeStreamer-Android-apk
          path: dist/HomeStreamer-Android.apk

  release:
    name: GitHub release
    # Every push to main publishes a new release, so "latest release" is always the newest build.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum HomeStreamer.exe HomeStreamer-Android.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Lets anyone check a download came from this repository's build:
      #   gh attestation verify HomeStreamer.exe --repo mosheshaul/home-streamer
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/HomeStreamer.exe
            dist/HomeStreamer-Android.apk
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/HomeStreamer.exe
            dist/HomeStreamer-Android.apk
            dist/SHA256SUMS.txt
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: Home Streamer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          generate_release_notes: true
